<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width">
<style>body{margin:0;overflow:hidden;background:#000;color:#fff;font-family:monospace}#ui{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.8);padding:12px;border-radius:10px;font-size:18px}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body>
<div id="ui">LEVEL 1 | A/D MOVE | SPACE FLY SOON</div>
<script>
let S=new THREE.Scene(),C=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000),R=new THREE.WebGLRenderer();R.setSize(innerWidth,innerHeight);document.body.appendChild(R.domElement);
let rd=new THREE.Mesh(new THREE.PlaneGeometry(30,5000),new THREE.MeshBasicMaterial({color:0x444444}));rd.rotation.x=-1.57;S.add(rd);
let car=new THREE.Mesh(new THREE.BoxGeometry(1.5,1,2.8),new THREE.MeshBasicMaterial({color:0xff0000}));car.position.y=1;car.position.z=10;S.add(car);
let w=new THREE.Mesh(new THREE.BoxGeometry(5,0.4,1.5),new THREE.MeshBasicMaterial({color:0xffff00}));w.visible=false;car.add(w);
let pizzas=[],LVL=1,score=0,speed=10,pos=0,keys={},nitro=100;function spawn(n){pizzas.forEach(p=>S.remove(p));pizzas=[];for(let i=0;i<n;i++){let p=new THREE.Mesh(new THREE.CylinderGeometry(1,1,0.3,10),new THREE.MeshBasicMaterial({color:0xffaa00}));p.position.set((Math.random()-0.5)*22,0.7,-i*35-20);pizzas.push(p);S.add(p);}} spawn(20);
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
(function L(){requestAnimationFrame(L);pos+=0.8+speed/10;rd.position.z=pos%100;if(keys['a']||keys['ArrowLeft'])car.position.x-=0.3;if(keys['d']||keys['ArrowRight'])car.position.x+=0.3;car.position.x=Math.max(-12,Math.min(12,car.position.x));
let b=false;if(keys[' ']&&nitro>0&&LVL>=2){speed+=0.8;nitro-=0.8;b=true;w.visible=true;car.position.y=3;}else{w.visible=false;car.position.y+=(1-car.position.y)*0.1;if(nitro<100)nitro+=0.4;}
speed+=0.01;pizzas.forEach(p=>{p.rotation.y+=0.1;if(Math.abs(p.position.z+pos)<2&&Math.abs(p.position.x-car.position.x)<2&&p.visible){p.visible=false;score++;if(score>=10&&LVL==1){LVL=2;S.background=new THREE.Color(0x000022);rd.material.color.set(0x00ffff);spawn(25);alert("LEVEL 2 UNLOCKED! Nitro with SPACE!");}else if(score>=25&&LVL==2){LVL=3;S.background=new THREE.Color(0x110033);spawn(30);alert("LEVEL 3 SPACE RAINBOW! YOU ARE PIZZA GOD 1000! 👑");score=1000;}setTimeout(()=>{if(LVL<3){p.visible=true;p.position.x=(Math.random()-0.5)*22;}},1500);}});if(LVL==3)rd.material.color.setHSL((pos/100)%1,1,0.5);
document.getElementById('ui').innerHTML=`TEAM DARLING DUKE | LVL ${LVL}/3 | 🍕 ${score} | SPEED ${Math.floor(speed*20)} | NITRO ${Math.floor(nitro)}% ${b?'🪽 FLYING!':''}`;
C.position.set(car.position.x,7,car.position.z+14);C.lookAt(car.position);R.render(S,C);})()
</script></body></html>
